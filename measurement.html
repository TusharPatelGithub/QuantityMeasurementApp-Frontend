<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement Dashboard</title>
    <!-- CSS and Font Awesome -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <header class="dashboard-header">
        <div class="logo">
            <i class="fa-solid fa-scale-balanced"></i>
            <span>Quantity Measurement</span>
        </div>
        <button id="logout-btn" class="logout-btn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </button>
    </header>

    <main class="dashboard-main">
        <div class="converter-card">
            <h2>Measurement Converter</h2>
            
            <div class="measurement-type-selector">
                <button class="type-btn active" data-type="length"><i class="fa-solid fa-ruler"></i> Length</button>
                <button class="type-btn" data-type="volume"><i class="fa-solid fa-flask"></i> Volume</button>
                <button class="type-btn" data-type="weight"><i class="fa-solid fa-weight-hanging"></i> Weight</button>
                <button class="type-btn" data-type="temperature"><i class="fa-solid fa-temperature-half"></i> Temperature</button>
            </div>

            <div class="conversion-workspace">
                <div class="input-group-container">
                    <div class="value-input-group">
                        <label for="from-value">From</label>
                        <input type="number" id="from-value" value="1">
                    </div>
                    <div class="unit-select-group">
                        <label for="from-unit">Unit</label>
                        <select id="from-unit"></select>
                    </div>
                </div>

                <div class="swap-icon" id="swap-btn">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>

                <div class="input-group-container">
                    <div class="value-input-group">
                        <label for="to-value">To</label>
                        <input type="number" id="to-value" readonly>
                    </div>
                    <div class="unit-select-group">
                        <label for="to-unit">Unit</label>
                        <select id="to-unit"></select>
                    </div>
                </div>
            </div>
            
            <div class="conversion-result">
                <span id="formula-text">1 Unit = 1 Unit</span>
            </div>
        </div>
    </main>

    <script src="js/api-client.js"></script>
    <script src="js/measurement.js"></script>
</body>
</html>
