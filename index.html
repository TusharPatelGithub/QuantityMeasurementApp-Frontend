<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement App</title>
    <!-- CSS and Font Awesome -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="auth-container">
        <!-- Left Side: Illustration Area -->
        <section class="auth-illustration">
            <div class="illustration-circle">
                <img src="assets/quantity_measurement_illustration.png" alt="Quantity Measurement Illustration" id="illustration-img" onerror="this.style.display='none'">
            </div>
            <h2>QUANTITY MEASUREMENT APP</h2>
        </section>

        <!-- Right Side: Forms Area -->
        <section class="auth-form-section">
            <nav class="auth-tabs">
                <button class="tab-btn" id="login-tab">LOGIN</button>
                <button class="tab-btn active" id="signup-tab">SIGNUP</button>
            </nav>
            
            <!-- Login Form -->
            <div class="form-container" id="login-form-container" style="display: none;">
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email Id</label>
                        <input type="email" id="login-email" name="email" required>
                        <span class="error-message" id="login-email-error"></span>
                    </div>
                    <div class="form-group clearfix">
                        <label for="login-password">Password</label>
                        <div class="password-input">
                            <input type="password" id="login-password" name="password" required>
                            <i class="fa-solid fa-eye-slash toggle-password" data-target="login-password"></i>
                        </div>
                        <span class="error-message" id="login-password-error"></span>
                        <a href="#" class="float-right">Forgot Password?</a>
                    </div>
                    <button type="submit" class="submit-btn" id="login-submit-btn">Login</button>
                </form>
            </div>

            <!-- Signup Form -->
            <div class="form-container" id="signup-form-container">
                <form id="signup-form">
                    <div class="form-group">
                        <label for="signup-fullname">Full Name</label>
                        <input type="text" id="signup-fullname" name="fullName" required>
                        <span class="error-message" id="signup-fullname-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email Id</label>
                        <input type="email" id="signup-email" name="email" required>
                        <span class="error-message" id="signup-email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <div class="password-input">
                            <input type="password" id="signup-password" name="password" required>
                            <i class="fa-solid fa-eye-slash toggle-password" data-target="signup-password"></i>
                        </div>
                        <span class="error-message" id="signup-password-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="signup-mobile">Mobile Number</label>
                        <input type="tel" id="signup-mobile" name="mobile" required>
                        <span class="error-message" id="signup-mobile-error"></span>
                    </div>
                    <button type="submit" class="submit-btn" id="signup-submit-btn">Signup</button>
                </form>
            </div>
        </section>
    </main>
    
    <div id="toast-container"></div>

    <!-- JS Files -->
    <script src="js/api-client.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
